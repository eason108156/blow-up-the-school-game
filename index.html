<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 隨機校園探索遊戲 - Campus Explorer</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            user-select: none;
            background: #0f172a;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 瞄準準心 */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
        }
        #crosshair::before { top: 4px; left: -5px; width: 20px; height: 2px; }
        #crosshair::after { top: -5px; left: 4px; width: 2px; height: 20px; }

        /* HUD 介面 */
        #hud {
            position: absolute;
            top: 16px;
            left: 16px;
            color: #fff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            background: rgba(15, 23, 42, 0.7);
            padding: 14px 20px;
            border-radius: 10px;
            backdrop-filter: blur(8px);
            font-size: 14px;
            line-height: 1.6;
            z-index: 10;
            border: 1px solid rgba(255,255,255,0.15);
            pointer-events: none;
        }
        #hud h1 { margin: 0 0 6px 0; font-size: 18px; color: #38bdf8; }

        /* 雷達小地圖 */
        #minimap-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.7);
            overflow: hidden;
            background: rgba(15, 23, 42, 0.9);
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            z-index: 10;
            pointer-events: none;
        }
        #minimap {
            width: 100%;
            height: 100%;
        }

        /* 點擊開始遮罩 */
        #blocker {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 100;
        }
        #instructions {
            text-align: center;
            cursor: pointer;
            padding: 35px 55px;
            border: 2px solid #38bdf8;
            border-radius: 14px;
            background: rgba(30, 41, 59, 0.95);
            box-shadow: 0 0 35px rgba(56, 189, 248, 0.35);
        }
        #instructions h2 { font-size: 28px; margin: 0 0 10px 0; color: #38bdf8; }
        .key {
            display: inline-block;
            background: #475569;
            padding: 2px 7px;
            border-radius: 4px;
            border-bottom: 2px solid #1e293b;
            font-weight: bold;
            color: #f8fafc;
        }
    </style>
    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="crosshair"></div>
    <div id="canvas-container"></div>

    <div id="hud">
        <h1>校園隨機生成器</h1>
        <div>當前位置: <span id="location-name" style="color:#fde047">校園正門大道</span></div>
        <div>按 <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> 或 <span class="key">方向鍵</span> 移動</div>
        <div>按住 <span class="key">Shift</span> 衝刺 | <span class="key">空白</span> 跳躍</div>
        <div>按 <span class="key">R</span> 鍵：重新隨機生成校園地形與建築</div>
        <div style="font-size: 12px; color: #94a3b8; margin-top: 4px;">滑鼠左鍵可拖曳轉向 / 點擊進入沉浸鎖定</div>
    </div>

    <div id="minimap-container">
        <canvas id="minimap" width="180" height="180"></canvas>
    </div>

    <div id="blocker">
        <div id="instructions">
            <h2>校園自由探索遊戲</h2>
            <p style="font-size: 16px;">點擊此處立即開始探索</p>
            <p style="font-size: 13px; color: #94a3b8;">（支援 WASD / 方向鍵行走，滑鼠環顧四周）</p>
        </div>
    </div>

    <script>
        /* ================= 遊戲核心變數 ================= */
        const container = document.getElementById('canvas-container');
        const blocker = document.getElementById('blocker');
        const minimapCanvas = document.getElementById('minimap');
        const minimapCtx = minimapCanvas.getContext('2d');

        let scene, camera, renderer;
        let campusGroup = null;
        let colliders = [];
        let buildingZones = [];
        
        let isGameStarted = false;
        let isPointerLocked = false;
        let isMouseDown = false;
        let previousMousePosition = { x: 0, y: 0 };

        // 玩家座標與視角
        const player = {
            x: 0,
            y: 0,
            z: 70,
            vy: 0,
            yaw: 0,    // 水平視角 (弧度)
            pitch: 0   // 俯仰視角 (弧度)
        };
        const keys = {};
        let isGrounded = true;
        let prevTime = performance.now();

        init();
        animate();

        function init() {
            // 1. 場景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x93c5fd); // 天空藍
            scene.fog = new THREE.FogExp2(0xcfe4ff, 0.0035);

            // 2. 攝影機
            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 800);
            camera.rotation.order = 'YXZ';

            // 3. 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // 4. 光照系統
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.55);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfffbeb, 0.95);
            sunLight.position.set(120, 180, 90);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 10;
            sunLight.shadow.camera.far = 450;
            const d = 160;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            sunLight.shadow.bias = -0.0004;
            scene.add(sunLight);

            setupInputListeners();
            window.addEventListener('resize', onWindowResize);

            // 隨機生成校園
            generateRandomCampus();
        }

        /* ================= 鍵盤與滑鼠全面事件綁定 ================= */
        function setupInputListeners() {
            // 點擊開始
            blocker.addEventListener('click', () => {
                isGameStarted = true;
                blocker.style.display = 'none';
                try {
                    document.body.requestPointerLock();
                } catch(e) {}
            });

            document.addEventListener('pointerlockchange', () => {
                isPointerLocked = (document.pointerLockElement === document.body || document.pointerLockElement === renderer.domElement);
            });

            // 滑鼠移動與拖曳轉向支援
            window.addEventListener('mousedown', (e) => {
                isMouseDown = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
                if (isGameStarted && !isPointerLocked && e.target !== blocker) {
                    try { document.body.requestPointerLock(); } catch(err) {}
                }
            });

            window.addEventListener('mouseup', () => {
                isMouseDown = false;
            });

            window.addEventListener('mousemove', (e) => {
                if (!isGameStarted) return;

                let dx = 0;
                let dy = 0;

                if (isPointerLocked) {
                    dx = e.movementX || 0;
                    dy = e.movementY || 0;
                } else if (isMouseDown) {
                    dx = e.clientX - previousMousePosition.x;
                    dy = e.clientY - previousMousePosition.y;
                    previousMousePosition = { x: e.clientX, y: e.clientY };
                }

                if (dx !== 0 || dy !== 0) {
                    player.yaw -= dx * 0.0024;
                    player.pitch -= dy * 0.0024;
                    // 限制上下視角
                    player.pitch = Math.max(-1.45, Math.min(1.45, player.pitch));
                }
            });

            // 鍵盤監聽（支援 WASD、方向鍵、大小寫容錯）
            window.addEventListener('keydown', (e) => {
                keys[e.code] = true;
                if (e.key) keys[e.key.toLowerCase()] = true;

                // 空白鍵跳躍
                if ((e.code === 'Space' || e.key === ' ') && isGrounded) {
                    player.vy = 10.5;
                    isGrounded = false;
                }

                // R 鍵重新生成
                if (e.code === 'KeyR' || e.key === 'r' || e.key === 'R') {
                    generateRandomCampus();
                }
            });

            window.addEventListener('keyup', (e) => {
                keys[e.code] = false;
                if (e.key) keys[e.key.toLowerCase()] = false;
            });
        }

        /* ================= 隨機校園生成系統 ================= */
        function generateRandomCampus() {
            if (campusGroup) {
                scene.remove(campusGroup);
                campusGroup.traverse(c => {
                    if (c.geometry) c.geometry.dispose()
