<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 寫實校園探索模擬器 - Real Campus Simulator</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", Roboto, sans-serif;
            user-select: none;
            background: #0f172a;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 瞄準準心 */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 0 2px rgba(0,0,0,0.8);
        }
        #crosshair::before { top: 3px; left: -6px; width: 20px; height: 2px; }
        #crosshair::after { top: -6px; left: 3px; width: 2px; height: 20px; }

        /* 左上角 HUD 資訊板 */
        #hud {
            position: absolute;
            top: 16px;
            left: 16px;
            color: #fff;
            background: rgba(15, 23, 42, 0.88);
            padding: 16px 20px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            font-size: 13.5px;
            line-height: 1.6;
            z-index: 10;
            border: 1px solid rgba(56, 189, 248, 0.4);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            pointer-events: none;
        }
        .badge {
            display: inline-block;
            background: #0284c7;
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 7px;
            border-radius: 4px;
            margin-bottom: 4px;
        }
        #hud h1 { margin: 0 0 6px 0; font-size: 18px; color: #38bdf8; letter-spacing: 0.5px; }

        .key-row { margin-top: 5px; }
        .key {
            display: inline-block;
            background: #334155;
            padding: 2px 7px;
            border-radius: 4px;
            border-bottom: 2px solid #1e293b;
            font-weight: bold;
            color: #38bdf8;
            font-size: 12px;
        }

        /* 雷達小地圖 */
        #minimap-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 190px;
            height: 190px;
            border-radius: 50%;
            border: 3px solid rgba(56, 189, 248, 0.85);
            overflow: hidden;
            background: rgba(15, 23, 42, 0.92);
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            z-index: 10;
            pointer-events: none;
        }
        #minimap {
            width: 100%;
            height: 100%;
        }

        /* 底部快速傳送列（支援一鍵進入寫實室內） */
        #teleport-bar {
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(56, 189, 248, 0.35);
            padding: 9px 18px;
            border-radius: 35px;
            display: flex;
            gap: 10px;
            z-index: 10;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }
        .tp-btn {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .tp-btn:hover {
            background: #0284c7;
            border-color: #38bdf8;
            transform: translateY(-2px);
        }
    </style>
    <!-- Three.js 核心庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="crosshair"></div>
    <div id="canvas-container"></div>

    <div id="hud">
        <span class="badge">Google Maps 寫實街景重構版</span>
        <h1>寫實校園探索模擬器</h1>
        <div>當前定位: <span id="location-name" style="color:#fde047; font-weight:bold;">校門口迎賓大道</span></div>
        <div class="key-row">移動: <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> / <span class="key">方向鍵</span> | <span class="key">Shift</span> 衝刺 | <span class="key">空白</span> 跳躍</div>
        <div class="key-row">功能: <span class="key">V</span> 空拍無人機俯瞰 | <span class="key">R</span> 隨機重建校園</div>
        <div class="key-row" style="color:#94a3b8; font-size:12px;">滑鼠左鍵按住拖曳可環顧四周 / 點擊進入沉浸鎖定</div>
    </div>

    <!-- 快捷傳送導覽列 -->
    <div id="teleport-bar">
        <button class="tp-btn" onclick="teleportTo(0)">[1] 教室 201 內部</button>
        <button class="tp-btn" onclick="teleportTo(1)">[2] 行政樓與榮譽廳</button>
        <button class="tp-btn" onclick="teleportTo(2)">[3] 體育館木地板球場</button>
        <button class="tp-btn" onclick="teleportTo(3)">[4] 泳池水道跳水台</button>
        <button class="tp-btn" onclick="teleportTo(4)">[5] 操場與司令台</button>
        <button class="tp-btn" onclick="teleportTo(5)">[6] 戶外壓克力籃球場</button>
        <button class="tp-btn" onclick="teleportToGate()">[7] 校門口國旗廣場</button>
    </div>

    <div id="minimap-container">
        <canvas id="minimap" width="190" height="190"></canvas>
    </div>

    <script>
        /* ================= 遊戲核心與物理變數 ================= */
        const container = document.getElementById('canvas-container');
        const minimapCanvas = document.getElementById('minimap');
        const minimapCtx = minimapCanvas.getContext('2d');

        let scene, camera, renderer;
        let campusGroup = null;
        let colliders = [];
        let buildingZones = [];

        // 玩家狀態
        const player = {
            x: 0,
            y: 0,
            z: 90,
            vy: 0,
            yaw: 0,
            pitch: 0
        };

        let isDroneView = false; // 無人機高空空拍視角
        let isGrounded = true;
        let isPointerLocked = false;
        let isMouseDown = false;
        let prevMousePos = { x: 0, y: 0 };
        const keys = {};
        let prevTime = performance.now();

        init();
        animate();

        function init() {
            // 1. 場景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xbbe1fa); // 晴空微蔚藍
            scene.fog = new THREE.FogExp2(0xe2edf8, 0.0028);

            // 2. 攝影機
            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 950);
            camera.rotation.order = 'YXZ';

            // 3. 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.1;
            container.appendChild(renderer.domElement);

            // 4. 真實光影系統
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x445566, 0.65);
            scene.add(hemiLight);

            const sunLight = new THREE.DirectionalLight(0xfff7e6, 1.15);
            sunLight.position.set(130, 200, 100);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 20;
            sunLight.shadow.camera.far = 500;
            const d = 170;
            sunLight.shadow.camera.left = -d; sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d; sunLight.shadow.camera.bottom = -d;
            sunLight.shadow.bias = -0.0003;
            scene.add(sunLight);

            setupControls();
            window.addEventListener('resize', onWindowResize);

            // 生成校園
            generateRandomCampus();
        }

        /* ================= 自由操作與視角系統 ================= */
        function setupControls() {
            container.addEventListener('click', () => {
                if (!isPointerLocked && !isDroneView) {
                    try { document.body.requestPointerLock(); } catch(e){}
                }
            });

            document.addEventListener('pointerlockchange', () => {
                isPointerLocked = (document.pointerLockElement === document.body);
            });

            window.addEventListener('mousedown', (e) => {
                if (e.target.tagName === 'BUTTON') return;
                isMouseDown = true;
                prevMousePos = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('mouseup', () => isMouseDown = false);

            window.addEventListener('mousemove', (e) => {
                let dx = 0, dy = 0;
                if (isPointerLocked) {
                    dx = e.movementX || 0;
                    dy = e.movementY || 0;
                } else if (isMouseDown) {
                    dx = e.clientX - prevMousePos.x;
                    dy = e.clientY - prevMousePos.y;
                    prevMousePos = { x: e.clientX, y: e.clientY };
                }

                if (!isDroneView && (dx !== 0 || dy !== 0)) {
                    player.yaw -= dx * 0.0026;
                    player.pitch -= dy * 0.0026;
                    player.pitch = Math.max(-1.42, Math.min(1.42, player.pitch));
                }
            });

            window.addEventListener('keydown', (e) => {
                keys[e.code] = true;
                if (e.key) keys[e.key.toLowerCase()] = true;

                if ((e.code === 'Space' || e.key === ' ') && isGrounded && !isDroneView) {
                    player.vy = 10.5;
                    isGrounded = false;
                }
                if (e.code === 'KeyR' || e.key === 'r') generateRandomCampus();
                if (e.code === 'KeyV' || e.key === 'v') {
                    isDroneView = !isDroneView;
                    if (isDroneView && isPointerLocked) document.exitPointerLock();
                }
                if (e.key >= '1' && e.key <= '6') teleportTo(parseInt(e.key) - 1);
                if (e.key === '7') teleportToGate();
            });

            window.addEventListener('keyup', (e) => {
                keys[e.code] = false;
                if (e.key) keys[e.key.toLowerCase()] = false;
            });
        }

        /* ================= 快捷傳送點 ================= */
        window.teleportTo = function(idx) {
            if (buildingZones[idx]) {
                const b = buildingZones[idx];
                player.x = b.x;
                player.z = b.z + (b.enterOffsetZ || 0);
                player.y = 0;
                player.vy = 0;
                player.yaw = b.enterYaw || 0;
                player.pitch = 0;
                isDroneView = false;
            }
        };

        window.teleportToGate = function() {
            player.x = 0;
            player.y = 0;
            player.z = 110;
            player.vy = 0;
            player.yaw = 0;
            player.pitch = 0;
            isDroneView = false;
        };

        /* ================= 擬真校園隨機生成系統 ================= */
        function generateRandomCampus() {
            if (campusGroup) {
                scene.remove(campusGroup);
                campusGroup.traverse(c => {
                    if (c.geometry) c.geometry.dispose();
                    if (c.material) {
                        if (Array.isArray(c.material)) c.material.forEach(m => m.dispose());
                        else c.material.dispose();
                    }
                });
            }

            campusGroup = new THREE.Group();
            colliders = [];
            buildingZones = [];

            // 1. 地貌底盤（中央校園硬化路面與草地）
            createRealisticTerrain(campusGroup);

            // 2. 六大核心真實規格設施
            const facilities = [
                { id: 'teaching', name: '綜合教學大樓', w: 48, d: 24, builder: buildTeachingBuilding, enterOffsetZ: 0, enterYaw: 0 },
                { id: 'admin', name: '校務行政大樓', w: 42, d: 26, builder: buildAdminBuilding, enterOffsetZ: 3, enterYaw: 0 },
                { id: 'gym', name: '室內體育館', w: 44, d: 32, builder: buildGymnasium, enterOffsetZ: 0, enterYaw: 0 },
                { id: 'pool', name: '標準泳池溫水館', w: 40, d: 28, builder: buildPoolBuilding, enterOffsetZ: 4, enterYaw: 0 },
                { id: 'playground', name: '綜合田徑操場', w: 86, d: 54, builder: buildTrackAndField, enterOffsetZ: 0, enterYaw: 0 },
                { id: 'court', name: '戶外壓克力籃球場', w: 38, d: 24, builder: buildOutdoorBasketballCourt, enterOffsetZ: 0, enterYaw: 0 }
            ];

            // Google Maps 常見的四角分區＋兩側地塊
            const plots = [
                { x: -80, z: -80 }, { x: 80, z: -80 },
                { x: -85, z: 12 },  { x: 85, z: 12 },
                { x: -80, z: 105 }, { x: 80, z: 105 }
            ];
            shuffle(plots);

            facilities.forEach((fac, i) => {
                const pt = plots[i];
                const posX = pt.x + (Math.random() - 0.5) * 6;
                const posZ = pt.z + (Math.random() - 0.5) * 6;
                // 固定 0 度或 180 度，符合 Google 地圖方正建築坐向
                const rotY = (Math.random() > 0.5) ? 0 : Math.PI;

                const facGrp = new THREE.Group();
                facGrp.position.set(posX, 0, posZ);
                facGrp.rotation.y = rotY;

                fac.builder(facGrp);
                campusGroup.add(facGrp);

                buildingZones.push({
                    name: fac.name,
                    x: posX,
                    z: posZ,
                    radius: Math.max(fac.w, fac.d) * 0.65,
                    enterOffsetZ: fac.enterOffsetZ,
                    enterYaw: rotY + fac.enterYaw
                });
            });

            // 3. 校門景觀、柏油主幹道、人行紅磚道與斑馬線
            createRoadNetworkAndGate(campusGroup);

            // 4. 校園中庭升旗台與國旗
            createFlagpolePlaza(campusGroup);

            // 5. 行道樹木、高壓路燈、分類垃圾桶與長椅
            createRealisticVegetationAndProps(campusGroup);

            scene.add(campusGroup);

            // 更新世界矩陣並生成精確碰撞體
            scene.updateMatrixWorld(true);
            campusGroup.traverse(child => {
                if (child.userData && child.userData.isCollider) {
                    colliders.push(new THREE.Box3().setFromObject(child));
                }
            });

            // 玩家安全出生於校門口迎賓大道
            player.x = 0;
            player.y = 0;
            player.z = 100;
            player.vy = 0;
            player.yaw = 0;
            player.pitch = 0;
        }

        /* ================= 1. 地貌、校門與 Google Maps 式路網 ================= */
        function createRealisticTerrain(parent) {
            // 平整大草皮底盤
            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(380, 380),
                new THREE.MeshLambertMaterial({ color: 0x4d7c0f }) // 台灣校園常規草皮色
            );
            ground.rotateX(-Math.PI / 2);
            ground.receiveShadow = true;
            parent.add(ground);

            // 圍牆與抿石子基座
            const wallMat = new THREE.MeshLambertMaterial({ color: 0x94a3b8 });
            const addPerimeter = (w, d, px, pz) => {
                const wall = new THREE.Mesh(new THREE.BoxGeometry(w, 3.5, d), wallMat);
                wall.position.set(px, 1.75, pz);
                wall.userData.isCollider = true;
                parent.add(wall);
            };
            addPerimeter(380, 2, 0, -190);
            addPerimeter(380, 2, 0, 190);
            addPerimeter(2, 380, -190, 0);
            addPerimeter(2, 380, 190, 0);
        }

        function createRoadNetworkAndGate(parent) {
            const asphaltMat = new THREE.MeshLambertMaterial({ color: 0x272e3b }); // 真正磨耗柏油路
            const curbMat = new THREE.MeshLambertMaterial({ color: 0xc4b5fd }); // 紅磚高壓透水人行道

            // 主幹迎賓大道 (南北向，寬 16 米)
            const mainRoad = new THREE.Mesh(new THREE.PlaneGeometry(16, 340), asphaltMat);
            mainRoad.rotateX(-Math.PI / 2);
            mainRoad.position.y = 0.04;
            mainRoad.receiveShadow = true;
            parent.add(mainRoad);

            // 人行道紅磚緣石 (大道兩側)
            const sidewalkL = new THREE.Mesh(new THREE.PlaneGeometry(3.5, 340), new THREE.MeshLambertMaterial({ color: 0xb45309 }));
            sidewalkL.rotateX(-Math.PI / 2);
            sidewalkL.position.set(-9.75, 0.06, 0);
            parent.add(sidewalkL);
            const sidewalkR = sidewalkL.clone();
            sidewalkR.position.x = 9.75;
            parent.add(sidewalkR);

            // 橫向幹道 (東西向)
            const crossRoad = new THREE.Mesh(new THREE.PlaneGeometry(340, 14), asphaltMat);
            crossRoad.rotateX(-Math.PI / 2);
            crossRoad.position.y = 0.04;
            crossRoad.receiveShadow = true;
            parent.add(crossRoad);

            // 斑馬線（行人穿越道線）
            createZebraCrossing(parent, 0, 80);
            createZebraCrossing(parent, 0, -20);

            // 減速坡（黃黑相間）
            const bump = new THREE.Mesh(new THREE.BoxGeometry(16, 0.12, 0.8), new THREE.MeshLambertMaterial({ color: 0xeab308 }));
            bump.position.set(0, 0.08, 95);
            parent.add(bump);

            // 校門口與警衛室 (Z = 135)
            createSchoolGate(parent, 0, 135);
        }

        function createZebraCrossing(parent, x, z) {
            const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            for (let i = -6; i <= 6; i += 1.8) {
                const stripe = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 4.5), whiteMat);
                stripe.rotateX(-Math.PI / 2);
                stripe.position.set(x + i, 0.05, z);
                parent.add(stripe);
            }
        }

        function createSchoolGate(parent, x, z) {
            const concreteMat = new THREE.MeshLambertMaterial({ color: 0xe2e8f0 });
            const darkSteelMat = new THREE.MeshLambertMaterial({ color: 0x1e293b });

            // 左右校門柱與校名刻字石碑
            const pL = new THREE.Mesh(new THREE.BoxGeometry(2.5, 6, 2.5), concreteMat);
            pL.position.set(x - 9, 3, z);
            pL.userData.isCollider = true;
            parent.add(pL);

            const pR = pL.clone();
            pR.position.set(x + 9, 3, z);
            pR.userData.isCollider = true;
            parent.add(pR);

            // 門楣校名橫牌
            const beam = new THREE.Mesh(new THREE.BoxGeometry(20.5, 1.4, 2), darkSteelMat);
            beam.position.set(x, 6, z);
            parent.add(beam);

            // 警衛傳達室（小型真實崗哨）
            const guardHouse = new THREE.Group();
            guardHouse.position.set(x + 13.5, 0, z);

            const ghBody = new THREE.Mesh(new THREE.BoxGeometry(5.5, 4, 6), concreteMat);
            ghBody.position.y = 2;
            ghBody.userData.isCollider = true;
            guardHouse.add(ghBody);

            // 警衛室大窗戶
            const windowGlass = new THREE.Mesh(new THREE.PlaneGeometry(3, 1.5), new THREE.MeshLambertMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.6 }));
            windowGlass.position.set(-2.76, 2.2, 0);
            windowGlass.rotation.y = -Math.PI / 2;
            guardHouse.add(windowGlass);

            parent.add(guardHouse);
        }

        // 中庭升旗台與國旗
        function createFlagpolePlaza(parent) {
            const plazaGrp = new THREE.Group();
            plazaGrp.position.set(0, 0, 0);

            // 階梯大理石基台
            const step1 = new THREE.Mesh(new THREE.BoxGeometry(10, 0.3, 7), new THREE.MeshLambertMaterial({ color: 0xd1d5db }));
            step1.position.y = 0.15;
            plazaGrp.add(step1);
            const step2 = new THREE.Mesh(new THREE.BoxGeometry(8, 0.3, 5), new THREE.MeshLambertMaterial({ color: 0xe5e7eb }));
            step2.position.y = 0.45;
            plazaGrp.add(step2);

            // 三根不鏽鋼旗桿
            const poleMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.2, metalness: 0.8 });
            [-2.4, 0, 2.4].forEach((px, idx) => {
                const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 12, 12), poleMat);
                pole.position.set(px, 6.4, 0);
                pole.userData.isCollider = true;
                plazaGrp.add(pole);

                // 中央旗桿懸掛國旗
                if (idx === 1) {
                    const flagTex = createNationalFlagTexture();
                    const flag = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 1.6), new THREE.MeshLambertMaterial({ map: flagTex, side: THREE.DoubleSide }));
                    flag.position.set(px + 1.25, 11, 0);
                    plazaGrp.add(flag);
                }
            });

            parent.add(plazaGrp);
        }

        /* ================= 2. 教學大樓與教室室內（依真實照片還原） ================= */
        function buildTeachingBuilding(grp) {
            const w = 48, d = 22, h = 8.5;
            const tileMat = new THREE.MeshLambertMaterial({ color: 0xfef08a }); // 鵝黃色丁掛磚外牆
            const innerWhiteMat = new THREE.MeshLambertMaterial({ color: 0xf8fafc });
            const floorMat = new THREE.MeshLambertMaterial({ color: 0xcbd5e1 }); // 磨石子防滑地坪

            // 地板與樓板天花
            grp.add(createBox(w, 0.4, d, 0, 0.2, 0, floorMat));
            grp.add(createBox(w, 0.4, d, 0, h, 0, tileMat));

            // 外牆 (留大門進出口)
            grp.add(createWall(w, h, 0.5, 0, h/2, -d/2, tileMat));
            grp.add(createWall(0.5, h, d, -w/2, h/2, 0, tileMat));
            grp.add(createWall(0.5, h, d, w/2, h/2, 0, tileMat));
            createDoorway(grp, w, h, 0.5, 0, h/2, d/2, 7, 4.5, tileMat);

            // 中央走廊隔間牆（帶教室對開鋁門與上方採光窗洞）
            createDoorway(grp, w - 4, h, 0.35, 0, h/2, -3.2, 3.2, 3.6, innerWhiteMat);
            createDoorway(grp, w - 4, h, 0.35, 0, h/2, 3.2, 3.2, 3.6, innerWhiteMat);

            // 教室隔間牆

        /* ================= 6. 綜合田徑操場與司令台 ================= */
        function buildTrackAndField(grp) {
            const w = 86, d = 54;

            // PU 紅褐色跑道真實動態標線
            const cvs = document.createElement('canvas');
            cvs.width = 1024; cvs.height = 512;
            const ctx = cvs.getContext('2d');

            ctx.fillStyle = "#b91c1c"; // 經典紅褐色跑道
            ctx.fillRect(0, 0, cvs.width, cvs.height);

            // 內圈綠色足球草皮
            ctx.fillStyle = "#15803d";
            ctx.beginPath();
            ctx.ellipse(512, 256, 360, 180, 0, 0, Math.PI * 2);
            ctx.fill();

            // 足球中圈線與禁區白色標線
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 4;
            ctx.strokeRect(180, 150, 120, 212);
            ctx.strokeRect(724, 150, 120, 212);
            ctx.beginPath();
            ctx.arc(512, 256, 60, 0, Math.PI * 2);
            ctx.moveTo(512, 76); ctx.lineTo(512, 436);
            ctx.stroke();

            // 6 道白色標準跑道標線
            for (let r = 0; r < 6; r++) {
                ctx.beginPath();
                ctx.ellipse(512, 256, 375 + r * 20, 195 + r * 15, 0, 0, Math.PI * 2);
                ctx.stroke();
            }

            const track = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshLambertMaterial({ map: new THREE.CanvasTexture(cvs) }));
            track.rotateX(-Math.PI / 2);
            track.position.y = 0.08;

        /* ================= 貼圖動態生成工具 ================= */
        // 真實黑板紋理（手寫數學公式、幾何圖形、值日生）
        function createRealisticBlackboardTexture() {
            const cvs = document.createElement('canvas');
            cvs.width = 1024; cvs.height = 512;
            const ctx = cvs.getContext('2d');
            ctx.fillStyle = "#14532d"; // 深沉亞光黑板綠
            ctx.fillRect(0, 0, cvs.width, cvs.height);

            // 磨耗粉筆痕跡
            ctx.fillStyle = "rgba(255,255,255,0.08)";
            for (let i = 0; i < 40; i++) {
                ctx.fillRect(Math.random() * 1024, Math.random() * 512, Math.random() * 200, Math.random() * 40);
            }

            // 白色手寫粉筆板書
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 32px sans-serif";
            ctx.fillText("【單元三：二次函數與幾何軌跡】", 60, 80);

            ctx.font = "28px monospace";
            ctx.fillText("f(x) = ax² + bx + c  (a ≠ 0)", 80, 160);
            ctx.fillText("頂點坐標: (-b/2a, (4ac - b²)/4a)", 80, 220);
            ctx.fillText("判別式 Δ = b² - 4ac > 0 (兩相異實根)", 80, 280);

            // 幾何拋物線圖形
            ctx.strokeStyle = "#facc15"; // 黃色粉筆
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(680, 320);
            ctx.quadraticCurveTo(780, 140, 880, 320);
            ctx.stroke();

            // 右上角今日值日生與作業
            ctx.font = "22px sans-serif";
            ctx.fillStyle = "#38bdf8"; // 藍色粉筆
            ctx.fillText("今日值日: 05, 18", 740, 60);
            ctx.fillText("作業: 習作 P.42~45", 740, 95);

            return new THREE.CanvasTexture(cvs);
        }

        function createNationalFlagTexture() {
            const cvs = document.createElement('canvas');
            cvs.width = 480; cvs.height = 320;
            const ctx = cvs.getContext('2d');
            ctx.fillStyle = "#ef4444"; // 滿地紅
            ctx.fillRect(0, 0, 480, 320);
            ctx.fillStyle = "#1e3a8a"; // 青天
            ctx.fillRect(0, 0, 240, 160);
            // 白日
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(120, 80, 40, 0, Math.PI * 2);
            ctx.fill();
            return new THREE.CanvasTexture(cvs);
        }

        function createRealisticGymCourtTexture() {
            const cvs = document.createElement('canvas');
            cvs.width = 1024; cvs.height = 512;
            const ctx = cvs.getContext('2d');
            // 亮面楓木拼花紋路
            ctx.fillStyle = "#eab308";
            ctx.fillRect(0, 0, cvs.width, cvs.height);
            ctx.fillStyle = "rgba(0,0,0,0.05)";
            for (let y = 0; y < 512; y += 8) {
                ctx.fillRect(0, y, 1024, 3);
            }
            // 鮮明白色籃球邊界與禁區
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 6;
            ctx.strokeRect(30, 30, 964, 452);
            ctx.beginPath();
            ctx.moveTo(512, 30); ctx.lineTo(512, 482);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(512, 256, 70, 0, Math.PI * 2);
            ctx.stroke();
            return new THREE.CanvasTexture(cvs);
        }

        function createScoreboardMesh() {
            const cvs = document.createElement('canvas');
            cvs.width = 512; cvs.height = 256;
            const ctx = cvs.getContext('2d');
            ctx.fillStyle = "#000000"; ctx.fillRect(0, 0, 512, 256);
            ctx.strokeStyle = "#ef4444"; ctx.lineWidth = 6; ctx.strokeRect(4, 4, 504, 248);

            ctx.fillStyle = "#22c55e"; ctx.font = "bold 42px sans-serif";
            ctx.fillText("HOME", 60, 70); ctx.fillText("GUEST", 320, 70);
            ctx.fillStyle = "#ef4444"; ctx.font = "bold 90px monospace";
            ctx.fillText("88", 80, 180); ctx.fillText("82", 340, 180);
            ctx.fillStyle = "#eab308"; ctx.font = "32px monospace";
            ctx.fillText("PERIOD 4", 190, 230);

            return new THREE.Mesh(new THREE.BoxGeometry(6.5, 3.2, 0.2), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cvs) }));
        }

        function createBannerMesh(text, w, h) {
            const cvs = document.createElement('canvas');
            cvs.width = 512; cvs.height = 128;
            const ctx = cvs.getContext('2d');
            ctx.fillStyle = "#b91c1c"; ctx.fillRect(0, 0, 512, 128);
            ctx.strokeStyle = "#facc15"; ctx.lineWidth = 8; ctx.strokeRect(6, 6, 500, 116);
            ctx.fillStyle = "#ffffff"; ctx.font = "bold 64px sans-serif";
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(text, 256, 64);
            return new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshLambertMaterial({ map: new THREE.CanvasTexture(cvs) }));
        }

        function createClassSign(grp, text, x, y, z) {
            const cvs = document.createElement('canvas');
            cvs.width = 256; cvs.height = 128;
            const ctx = cvs.getContext('2d');
            ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, 256, 128);
            ctx.strokeStyle = "#0284c7"; ctx.lineWidth = 8; ctx.strokeRect(4, 4, 248, 120);
            ctx.fillStyle = "#0284c7"; ctx.font = "bold 60px sans-serif";
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(text, 128, 64);
            const m = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.7, 0.1), new THREE.MeshLambertMaterial({ map: new THREE.CanvasTexture(cvs) }));
            m.position.set(x, y, z);
            grp.add(m);
        }

        function createRoofBillboard(grp, text, x, y, z) {
            const cvs = document.createElement('canvas');
            cvs.width = 512; cvs.height = 128;
            const ctx = cvs.getContext('2d');
            ctx.fillStyle = "#0f172a"; ctx.fillRect(0, 0, 512, 128);
            ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 6; ctx.strokeRect(4, 4, 504, 120);
            ctx.fillStyle = "#38bdf8"; ctx.font = "bold 56px sans-serif";
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(text, 256, 64);
            const sign = createBox(9.5, 2.4, 0.4, x, y, z, new THREE.MeshLambertMaterial({ map: new THREE.CanvasTexture(cvs) }));
            grp.add(sign);
        }

        /* ================= 通用輔助構造 ================= */
        function createBox(w, h, d, x, y, z, mat) {
            const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            m.position.set(x, y, z);
            return m;
        }

        function createWall(w, h, d, x, y, z, mat) {
            const wall = createBox(w, h, d, x, y, z, mat);
            wall.userData.isCollider = true;
            return wall;
        }

        function createDoorway(grp, totalW, h, thick, x, y, z, doorW, doorH, mat) {
            const sideW = (totalW - doorW) / 2;
            grp.add(createWall(sideW, h, thick, x - (doorW/2 + sideW/2), y, z, mat));
            grp.add(createWall(sideW, h, thick, x + (doorW/2 + sideW/2), y, z, mat));
            grp.add(createWall(doorW, h - doorH, thick, x, y + doorH/2, z, mat));
        }

        function createSoccerGoal(grp, x, rotY) {
            const gGrp = new THREE.Group();
            gGrp.position.set(x, 0, 0);
            gGrp.rotation.y = rotY;
            const mat = new THREE.MeshLambertMaterial({ color: 0xffffff });
            const p1 = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 2.5), mat);
            p1.position.set(0, 1.25, -3.2);
            const p2 = p1.clone();
            p2.position.set(0, 1.25, 3.2);
            const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 6.4), mat);
            bar.rotateX(Math.PI / 2);
            bar.position.set(0, 2.5, 0);
            gGrp.add(p1, p2, bar);
            grp.add(gGrp);
        }

        function createRealisticVegetationAndProps(parent) {
            const trunkMat = new THREE.MeshLambertMaterial({ color: 0x5c4033 });
            const leafMat = new THREE.MeshLambertMaterial({ color: 0x16a34a });

            // 65 棵大型樟樹/榕樹行道樹（避開大道與運動場）
            for (let i = 0; i < 65; i++) {
                const x = (Math.random() - 0.5) * 320;
                const z = (Math.random() - 0.5) * 320;
                if (Math.abs(x) < 22 || Math.abs(z) < 22) continue;

                const tGrp = new THREE.Group();
                tGrp.position.set(x, 0, z);
                const h = 4.5 + Math.random() * 2.5;
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.5, h, 8), trunkMat);
                trunk.position.y = h / 2;
                trunk.userData.isCollider = true;
                tGrp.add(trunk);

                const crown = new THREE.Mesh(new THREE.SphereGeometry(2.8 + Math.random() * 0.8, 8, 8), leafMat);
                crown.position.y = h + 1.6;
                tGrp.add(crown);
                parent.add(tGrp);
            }

            // 路燈與休閒木椅
            for (let d = -130; d <= 130; d += 35) {
                if (Math.abs(d) < 20) continue;
                // 現代高壓鈉路燈
                const lamp = new THREE.Group();
                lamp.position.set(11, 0, d);
                const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.16, 6), new THREE.MeshLambertMaterial({ color: 0x334155 }));
                pole.position.y = 3;
                pole.userData.isCollider = true;
                lamp.add(pole);
                const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.25, 1.2), new THREE.MeshBasicMaterial({ color: 0xfef08a }));
                head.position.set(0, 6, 0.5);
                lamp.add(head);
                parent.add(lamp);

                const lampL = lamp.clone();
                lampL.position.set(-11, 0, d);
                parent.add(lampL);
            }
        }

        function shuffle(a) {
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
        }

        /* ================= 物理運動與滑動碰撞循環 ================= */
        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1);
            prevTime = time;

            if (isDroneView) {
                // 無人機俯瞰全景
                camera.position.set(0, 160, 140);
                camera.lookAt(0, 0, 0);
                document.getElementById('location-name').innerText = "校園高空無人機全貌俯瞰";
            } else {
                // 第一人稱視角與物理移動
                const forwardX = -Math.sin(player.yaw);
                const forwardZ = -Math.cos(player.yaw);
                const rightX = Math.cos(player.yaw);
                const rightZ = -Math.sin(player.yaw);

                let mx = 0, mz = 0;
                if (keys['KeyW'] || keys['w'] || keys['ArrowUp']) { mx += forwardX; mz += forwardZ; }
                if (keys['KeyS'] || keys['s'] || keys['ArrowDown']) { mx -= forwardX; mz -= forwardZ; }
                if (keys['KeyA'] || keys['a'] || keys['ArrowLeft']) { mx -= rightX; mz -= rightZ; }
                if (keys['KeyD'] || keys['d'] || keys['ArrowRight']) { mx += rightX; mz += rightZ; }

                const len = Math.hypot(mx, mz);
                if (len > 0) { mx /= len; mz /= len; }

                const speed = (keys['ShiftLeft'] || keys['ShiftRight']) ? 22.0 : 12.0;
                const stepX = mx * speed * delta;
                const stepZ = mz * speed * delta;

                // X / Z 軸獨立滑動檢測 (絕對不卡死)
                const r = 0.5;
                const nextX = player.x + stepX;
                const nextZ = player.z + stepZ;

                let okX = true;
                const bX = new THREE.Box3(new THREE.Vector3(nextX - r, player.y + 0.2, player.z - r), new THREE.Vector3(nextX + r, player.y + 1.8, player.z + r));
                for (let i = 0; i < colliders.length; i++) {
                    if (bX.intersectsBox(colliders[i])) { okX = false; break; }
                }
                if (okX) player.x = nextX;

                let okZ = true;
                const bZ = new THREE.Box3(new THREE.Vector3(player.x - r, player.y + 0.2, nextZ - r), new THREE.Vector3(player.x + r, player.y + 1.8, nextZ + r));
                for (let i = 0; i < colliders.length; i++) {
                    if (bZ.intersectsBox(colliders[i])) { okZ = false; break; }
                }
                if (okZ) player.z = nextZ;

                // 重力與跳躍
                player.vy -= 26.0 * delta;
                player.y += player.vy * delta;
                if (player.y <= 0) {
                    player.y = 0;
                    player.vy = 0;
                    isGrounded = true;
                }

                camera.position.set(player.x, player.y + 1.7, player.z);
                camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');

                updateHUD();
            }

            renderMinimap();
            renderer.render(scene, camera);
        }

        function updateHUD() {
            let loc = "校門口迎賓大道";
            for (let i = 0; i < buildingZones.length; i++) {
                const b = buildingZones[i];
                if (Math.hypot(player.x - b.x, player.z - b.z) < b.radius) {
                    loc = b.name;
                    break;
                }
            }
            document.getElementById('location-name').innerText = loc;
        }

        function renderMinimap() {
            const ctx = minimapCtx;
            ctx.clearRect(0, 0, 190, 190);
            const scale = 0.45;
            const center = 95;

            ctx.save();
            ctx.translate(center, center);

            // 繪製地標點與名稱
            buildingZones.forEach(b => {
                const rx = (b.x - player.x) * scale;
                const rz = (b.z - player.z) * scale;
                ctx.fillStyle = "#38bdf8";
                ctx.beginPath();
                ctx.arc(rx, rz, 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 9px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(b.name.substring(0, 3), rx, rz - 8);
            });

            // 玩家方向箭頭
            ctx.rotate(-player.yaw);
            ctx.fillStyle = "#ef4444";
            ctx.beginPath();
            ctx.moveTo(0, -9);
            ctx.lineTo(6, 7);
            ctx.lineTo(-6, 7);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
